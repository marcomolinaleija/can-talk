name: Reportar un error
description: Cuenta qué falla y cómo repetirlo.
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué ocurrió?
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Explica los pasos para llegar al error
      description: Indica qué app o apartado abriste y qué acciones hiciste, en orden, hasta que ocurrió el fallo.
    validations:
      required: true

  - type: textarea
    id: resultado_esperado
    attributes:
      label: ¿Qué esperabas que ocurriera?

  - type: dropdown
    id: version_can_talk
    attributes:
      label: Versión de CAN Talk
      description: Selecciona la versión instalada. Si no la conoces, elige «No sé qué versión tengo».
      options:
        - "1.0.3"
        - "1.0.2"
        - "1.0.1"
        - "1.0.0"
        - Versión de pruebas
        - Otra versión
        - No sé qué versión tengo

  - type: dropdown
    id: version_android
    attributes:
      label: Versión de Android
      description: Si no la conoces, elige «No sé qué versión tengo».
      options:
        - Android 17
        - Android 16
        - Android 15
        - Android 14
        - Android 13
        - Android 12
        - Android 11
        - Android 10
        - Android 9
        - Android 8.1
        - Android 8.0
        - Otra versión
        - No sé qué versión tengo

  - type: input
    id: telefono
    attributes:
      label: Marca y modelo del teléfono

  - type: textarea
    id: detalles
    attributes:
      label: Otros datos
      description: Por ejemplo, la app donde ocurre o el teclado y sintetizador que usas.
