// For building the open-source release of TalkBack.

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.compose) apply false
}

apply from: 'shared.gradle'

apply from: 'version.gradle'

// Official APKs use a private key supplied outside the repository.
def productionSigning = [
    storePath: providers.environmentVariable('CANTALK_KEYSTORE_PATH').orNull,
    storePassword: providers.environmentVariable('CANTALK_STORE_PASSWORD').orNull,
    keyAlias: providers.environmentVariable('CANTALK_KEY_ALIAS').orNull,
    keyPassword: providers.environmentVariable('CANTALK_KEY_PASSWORD').orNull
]
def releaseVersion = providers.gradleProperty('canTalkReleaseVersion').getOrElse(talkbackVersionName)

// Validate only when building the application release, so contributors can build/test debug
// variants without access to the production key. Fail before any release tasks execute.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.project == rootProject && it.name ==~ /(?:assemble|bundle|package|validateSigning)(?:Phone|Wear)Release(?:Bundle)?/
    }
    if (buildsRelease) {
        if (canTalkTestBuild) {
            throw new GradleException('Release APKs must use can.cantalk. Do not combine release with canTalkTestBuild.')
        }
        if (!releaseVersion || !(releaseVersion ==~ /\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?/)) {
            throw new GradleException('Set -PcanTalkReleaseVersion to a version such as 1.0.0 or 1.0.0-rc.1.')
        }
        def missing = [
            CANTALK_KEYSTORE_PATH: productionSigning.storePath,
            CANTALK_STORE_PASSWORD: productionSigning.storePassword,
            CANTALK_KEY_ALIAS: productionSigning.keyAlias,
            CANTALK_KEY_PASSWORD: productionSigning.keyPassword
        ].findAll { key, value -> !value }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException('Missing release signing variables: ' + missing.join(', '))
        }
        def privateKeystore = file(productionSigning.storePath)
        if (!privateKeystore.isFile()) {
            throw new GradleException('CANTALK_KEYSTORE_PATH must point to an existing keystore file.')
        }
        if (privateKeystore.canonicalFile == file('keystore/debug.keystore').canonicalFile ||
                productionSigning.keyAlias == 'androiddebugkey') {
            throw new GradleException('The shared Android debug key cannot sign an official release.')
        }
    }
}

final BUILD_TIMESTAMP = new Date().format('yyyy_MM_dd_HHmm')

dependencies {
    implementation project(':talkback')
}

android {
    namespace = "com.android.talkback"
    defaultConfig {
        applicationId = talkbackApplicationId
        if (canTalkTestBuild) {
            resValue "string", "talkback_title", "can-talk — prueba"
        }
        versionCode = backtalkVersionCodeBase + gitCommitCount
        versionName = releaseVersion
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        multiDexEnabled = true
    }
    signingConfigs {
        production {
            if (productionSigning.storePath) {
                storeFile file(productionSigning.storePath)
            }
            storePassword productionSigning.storePassword
            keyAlias productionSigning.keyAlias
            keyPassword productionSigning.keyPassword
        }
        shared {
            storeFile file("keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        // Development builds use the shared debug key. Android runs a
        // debuggable app without compiling it, which makes navigation several times slower on
        // a watch, so they are not debuggable. Debug logging in the libraries stays on.
        debug {
            debuggable = false
            versionNameSuffix = "-dev-" + BUILD_TIMESTAMP
            // The independent test app keeps the local key used by existing phone installs.
            signingConfig canTalkTestBuild ? signingConfigs.debug : signingConfigs.shared
            // Shrinks and optimizes the libraries, so there is less code to load and compile.
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.production
            debuggable = false
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += ['LICENSE', 'README']
        }
        jniLibs {
            // On-device AI only runs on arm64-v8a (see OnDeviceAiSettings), so its 26 MB library
            // would never load on x86_64.
            excludes += ['lib/x86_64/liblitertlm_jni.so']
        }
    }
    lint {
        checkReleaseBuilds = false
        // Lint the library modules too, where most of the code is, in one report.
        checkDependencies = true
        // The issues that were already there when lint was added to CI. Only new ones fail the
        // build. To accept new ones on purpose, run ./gradlew updateLintBaselinePhoneDebug.
        baseline = file("lint-baseline.xml")
        abortOnError = true
    }
    productFlavors {
        phone {
            dimension = "target"
        }
        wear {
            dimension = "target"
            versionNameSuffix = "-wear"
        }
    }
}
